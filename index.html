<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>EnderNote - Local-First AI Voice Notes</title>
    <meta name="description" content="Offline-capable companion for ESP32 and browser voice notes with AI transcription, smart organizer, audio bookmarks, and knowledge graph." />
    <meta property="og:title" content="EnderNote - Local-First AI Voice Notes" />
    <meta property="og:description" content="Offline-capable companion for ESP32 and browser voice notes with AI transcription, smart organizer, audio bookmarks, and knowledge graph." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('endernote_theme') || localStorage.getItem('auranote_theme');
          var isDark = saved === 'dark' || (!saved && true);
          if (saved === 'light') isDark = false;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased dark:bg-stone-950 dark:text-stone-100 selection:bg-amber-200 dark:selection:bg-amber-900/60 font-sans">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
